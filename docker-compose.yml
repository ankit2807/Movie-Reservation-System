services:
  mongodb:
    image: mongo:7
    container_name: moviebook-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moviebook-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/public
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/movie-reservation-system
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_strong_64_char_production_secret_key_2026}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@moviebook.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminBook2026!}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
  uploads_data:
