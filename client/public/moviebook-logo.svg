<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="mbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2330"/>
      <stop offset="100%" stop-color="#0f1118"/>
    </linearGradient>
    <linearGradient id="mbRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f84464"/>
      <stop offset="100%" stop-color="#d61b3c"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#e5293e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#mbBg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Cinema Ticket Notches -->
  <circle cx="0" cy="64" r="10" fill="#0f1118" />
  <circle cx="128" cy="64" r="10" fill="#0f1118" />

  <!-- "m" Text in Pure White -->
  <text x="20" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Roboto', 'Segoe UI', sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-1">m</text>

  <!-- Skewed Red Badge for "b" -->
  <g transform="translate(66, 40)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="42" height="46" rx="8" transform="skewX(-10)" fill="url(#mbRed)"/>
    <text x="19" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Roboto', 'Segoe UI', sans-serif" font-size="36" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle">b</text>
  </g>

  <!-- Accent dots -->
  <circle cx="106" cy="22" r="3.5" fill="#f84464" opacity="0.9"/>
  <circle cx="22" cy="106" r="2.5" fill="#ffffff" opacity="0.4"/>
</svg>
