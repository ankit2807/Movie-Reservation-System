name: CI — Lint, Audit & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install backend dependencies & security audit
        run: |
          npm ci
          npm audit --audit-level=moderate

      - name: Verify backend JavaScript syntax
        run: |
          for f in index.js database/*.js models/*.js controller/*.js routes/*.js utils/*.js tools/*.js; do
            node --check "$f"
          done

      - name: Install client dependencies, security audit, ESLint & production build
        working-directory: ./client
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run lint
          npm run build
