name: CI — Typecheck, Lint, Audit & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install backend dependencies, security audit & TypeScript build
        run: |
          npm ci
          npm audit --audit-level=moderate
          npx tsc --noEmit -p tsconfig.json
          npm run build:server

      - name: Install client dependencies, security audit, TypeScript check, ESLint & production build
        working-directory: ./client
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run typecheck
          npm run lint
          npm run build
